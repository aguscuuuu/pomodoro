<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- google fonts -->
	<link rel="preconnect" href="https://fonts.googleapis.com" />
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
	<!-- font: raleway -->
	<link href="https://fonts.googleapis.com/css2?family=Raleway:ital,wght@0,100..900;1,100..900&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <!-- css -->
    <link rel="stylesheet" href="./style.css">
    <!-- icon -->
    <link rel="icon" href="">
    <title>Pomodoro</title>
</head>
    <body>
        <main class="pomodoro-container">
            <h1 class="title">Reloj Pomodoro</h1>
            <section class="pomodoro-card largo">
                <h2>Largo</h2>
                <div class="info">
                    <p>Tiempo de estudio: <b>50 minutos</b></p>
                    <p>Tiempo de descanso: <b>10 minutos</b></p>
                </div>
                <button class="start-btn">Iniciar</button>
            </section>
            <section class="pomodoro-card corto">
                <h2>Corto</h2>
                <div class="info">
                    <p>Tiempo de estudio: <b>25 minutos</b></p>
                    <p>Tiempo de descanso: <b>5 minutos</b></p>
                </div>
                <button class="start-btn">Iniciar</button>
            </section>
        </main>
        <script src="./main.js"></script>
    </body>
</html>
